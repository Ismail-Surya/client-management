# ===== Server =====
server.port=8642

# ===== Application =====
spring.application.name=client-management

# ===== DataSource (MySQL) =====
spring.datasource.url=jdbc:mysql://localhost:3306/client_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=springstudent
spring.datasource.password=springstudent
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===== Jackson =====
spring.jackson.default-property-inclusion=non_null

# ===== JWT (custom app properties) =====
app.jwt.secret=change-this-to-a-very-long-random-secret-key-at-least-32-bytes-for-hs256
app.jwt.expiration-ms=900000
app.jwt.issuer=client-management